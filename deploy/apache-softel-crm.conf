# SOFTEL CRM API — Apache 2.4 (Windows) virtual host
# Include from httpd.conf:  Include conf/extra/apache-softel-crm.conf
# Adjust the three paths below to your installation (forward slashes).

Define PHP_DIR "C:/php"
Define CRM_PUBLIC "C:/Projects/SOFTEL CRM/Laravel Backend/public"

# --- PHP (Thread Safe x64 build) ------------------------------------------
LoadModule php_module "${PHP_DIR}/php8apache2_4.dll"
PHPIniDir "${PHP_DIR}"
AddHandler application/x-httpd-php .php

# --- Listen on every interface, port 8000 ---------------------------------
Listen 0.0.0.0:8000

<VirtualHost *:8000>
    ServerName softel-crm.local
    DocumentRoot "${CRM_PUBLIC}"

    <Directory "${CRM_PUBLIC}">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Hide server details from responses.
    ServerSignature Off

    ErrorLog "logs/softel-crm-error.log"
    CustomLog "logs/softel-crm-access.log" common
</VirtualHost>

ServerTokens Prod
